name: pexdl
description: 私人本地使用的 Pexels 视频客户端（搜索 / 播放 / 批量下载 / m3u8）
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  video_player: ^2.8.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  path: ^1.9.0
  file_picker: ^8.3.7
  permission_handler: '>=11.0.0 <13.0.0'
  ffmpeg_kit_flutter_new: '>=4.0.0 <6.0.0'
  pointycastle: '>=3.7.0 <5.0.0'

flutter:
  uses-material-design: true
