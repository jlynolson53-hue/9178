name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Android 工程
        run: |
          flutter create --platforms=android --org com.pexdl --project-name pexdl .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: 获取依赖
        run: flutter pub get

      - name: 编译 APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: PexDL-apk
          path: build/app/outputs/flutter-apk/*-release.apk
